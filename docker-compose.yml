services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pqkd-relay-telemetry-backend
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: telemetry_backend=info,tower_http=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pqkd-relay-telemetry-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
